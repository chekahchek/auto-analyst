[project]
name = "auto-analyst"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.136.3",
    "langchain-anthropic>=1.4.3",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.1",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pydantic-settings>=2.0",
    "sqlmodel>=0.0.24",
    "uvicorn>=0.49.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires a running database",
]

[dependency-groups]
dev = [
    "alembic>=1.15.0",
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.7",
    "psycopg2-binary>=2.9.10",
    "pytest-asyncio>=0.25.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.16",
]
